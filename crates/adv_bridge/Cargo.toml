[package]
name = "adv_bridge"
version = "0.20.0-dev"
edition = "2024"
description = "Prototype editor <-> engine gRPC bridge: flat scene loading, delta edits and offscreen viewport frame streaming"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { path = "../..", version = "0.20.0-dev", default-features = false, features = ["3d"] }
crossbeam-channel = "0.5"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
png = "0.18"
